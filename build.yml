name: Build QuadMotion (Windows VST3)

on:
  workflow_dispatch:   # lets you start it manually from the Actions tab
  push:                # and it also runs on every upload / commit

jobs:
  build:
    runs-on: windows-2025
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release

      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: QuadMotion-VST3
          path: build/QuadMotion_artefacts/Release/VST3
          if-no-files-found: error
